name: Deploy Mr. Moppy to Cloudflare

on:
  push:
    branches:
      - website/mr-moppy-draft
    paths:
      - 'website/**'
      - '.github/workflows/deploy-mr-moppy.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: mr-moppy-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test project provisioning
        run: node --test .github/scripts/provision-pages.test.mjs

      - name: Check Cloudflare connection
        id: connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment is waiting for the Cloudflare account ID and API token."
            echo "### Cloudflare connection needed" >> "$GITHUB_STEP_SUMMARY"
            echo "No website was deployed. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Settings → Secrets and variables → Actions, then rerun this job." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Cloudflare Pages project
        if: steps.connection.outputs.ready == 'true'
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/provision-pages.mjs

      - name: Publish the website
        if: steps.connection.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages deploy website --project-name=mr-moppy-iftimie2002-preview --branch=website/mr-moppy-draft

      - name: Record the published address
        if: steps.connection.outputs.ready == 'true'
        env:
          SITE_URL: ${{ steps.project.outputs.site_url }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          echo "### Mr. Moppy deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
